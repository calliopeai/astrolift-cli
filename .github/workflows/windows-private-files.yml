name: Windows private files

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source revision to validate
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  private-files:
    name: Native Windows ACL and recovery tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Test actual file ACLs and saved-login round trips
        run: go test -v ./internal/privatefile ./internal/config
      - name: Test actual reviewed-request consumer recovery
        run: go test -v ./cmd -run '^(TestPrivateFile|TestReviewedRequestFile|TestReviewedPipeline)'
