name: Portable docs drift

# The CLI embeds a deliberately bounded snapshot of the canonical public docs.
# This job catches cross-repository drift even when no CLI change happens. A
# repository_dispatch sender can make the check immediate once the docs repo
# has a cross-repository GitHub App/PAT; the weekday schedule is the fallback.
on:
  schedule:
    - cron: '17 9 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types: [canonical-docs-updated]

permissions:
  contents: read

jobs:
  verify:
    name: Compare embedded guides with canonical docs
    runs-on: ubuntu-latest
    outputs:
      drift: ${{ steps.check.outcome == 'failure' }}
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          path: cli

      - name: Checkout canonical documentation
        uses: actions/checkout@v4
        with:
          repository: calliopeai/astrolift-docs
          path: canonical-docs
          token: ${{ secrets.PAT_CALLIOPE_CI }}

      - name: Verify release-matched snapshot
        id: check
        continue-on-error: true
        working-directory: cli
        run: make vendor-docs-check DOCS_SRC=../canonical-docs/docs

      - name: Explain the refresh path
        if: ${{ steps.check.outcome == 'failure' }}
        run: |
          printf '%s\n' \
            'Canonical docs changed without refreshing the CLI snapshot.' \
            'The refresh job opens or updates the "Refresh embedded docs" PR.' \
            'By hand, from the metarepo: make -C astrolift-cli vendor-docs'
          exit 1

  # On drift, regenerate the snapshot and keep one PR open with it (#172).
  # The commit is made through createCommitOnBranch with the PAT, so GitHub
  # signs it and it shows as verified; the PAT (not GITHUB_TOKEN) also lets
  # the PR start its own checks.
  refresh:
    name: Open or update the Refresh embedded docs PR
    needs: verify
    if: ${{ always() && needs.verify.outputs.drift == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: chore/refresh-embedded-docs
      GH_TOKEN: ${{ secrets.PAT_CALLIOPE_CI }}
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          path: cli
          ref: main
          token: ${{ secrets.PAT_CALLIOPE_CI }}

      - name: Checkout canonical documentation
        uses: actions/checkout@v4
        with:
          repository: calliopeai/astrolift-docs
          path: canonical-docs
          token: ${{ secrets.PAT_CALLIOPE_CI }}

      - name: Regenerate the embedded docs
        working-directory: cli
        run: make vendor-docs DOCS_SRC=../canonical-docs/docs

      - name: Commit to the refresh branch and open or update the PR
        working-directory: cli
        run: |
          set -euo pipefail
          DOCS_SHA="$(git -C ../canonical-docs rev-parse --short HEAD)"
          PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            if [ -z "$PR" ]; then
              # A branch left over from a merged or closed PR starts again from main.
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
            else
              git fetch -q origin "$BRANCH"
            fi
          fi
          if [ -n "$PR" ]; then
            BASE="$(git rev-parse FETCH_HEAD)"
          else
            BASE="$(git rev-parse HEAD)"
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$BASE" >/dev/null
          fi

          git add -A -- internal/portabledocs/content
          mapfile -t FILES < <(git diff --cached --name-only "$BASE" -- internal/portabledocs/content)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "$BRANCH already carries astrolift-docs $DOCS_SHA."
          else
            : > additions.jsonl
            for f in "${FILES[@]}"; do
              base64 -w0 "$f" > contents.b64
              jq -nc --arg path "$f" --rawfile contents contents.b64 '{path: $path, contents: $contents}' >> additions.jsonl
            done
            jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$BRANCH" --arg head "$BASE" \
              --arg headline "Refresh embedded docs from astrolift-docs $DOCS_SHA" \
              --slurpfile additions additions.jsonl '{
                query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
                variables: {input: {
                  branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                  expectedHeadOid: $head,
                  message: {headline: $headline},
                  fileChanges: {additions: $additions}
                }}
              }' > commit.json
            gh api graphql --input commit.json --jq '.data.createCommitOnBranch.commit.oid'
            echo "Refreshed: ${FILES[*]}"
          fi

          if [ -z "$PR" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "Refresh embedded docs" \
              --body "Generated by the Portable docs drift workflow: \`make vendor-docs\` against astrolift-docs main. Release builds refuse a snapshot that lags main (#172), so merge this before cutting a release."
          fi
